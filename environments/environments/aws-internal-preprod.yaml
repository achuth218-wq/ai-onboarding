product: kong-ai-gateway
runtime_version: 2.3.1
region: us
gateway_id: 00000000-0000-0000-0000-000000000000
namespace: ai-aws-internal-preprod
auth_strategy_id: 00000000-0000-0000-0000-000000000000
proxy_url: https://aws-internal-preprod.example.invalid
consumer_groups:
- ai-onboarding-testers
policy_profiles:
  llm-standard: []
  mcp-standard: []
  a2a-standard: []
upstreams:
  ticketing-mcp: https://tools-aws-internal-preprod.example.invalid/mcp
  support-agent: https://agent-aws-internal-preprod.example.invalid
smoke_auth_header: Authorization
minimum_nodes: 2
heartbeat_max_age_seconds: 120
readiness_timeout_seconds: 300
cloud: aws
exposure: internal
stage: preprod
enabled: false
cloud_scope: REPLACE_WITH_ACCOUNT_SUBSCRIPTION_OR_PROJECT
allowed_upstream_hosts:
- api.openai.com
- tools-aws-internal-preprod.example.invalid
- agent-aws-internal-preprod.example.invalid
approved_providers:
- openai
allowed_data_classes:
- public
- internal
- confidential
controls:
  private_ingress_verified: false
  public_edge_verified: false
  egress_restricted: false
  request_limits: false
  audit_redaction: false
  upstream_tls_verified: false
security_review_url: ''
