<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc"><title id="title">Independent AI promotions across AWS, Azure and GCP</title><desc id="desc">Six issue forms feed validated draft pull requests and security checks. An immutable bundle has separate manual triggers for dev, test, preprod and prod across six isolated cloud and exposure lanes. All 24 targets use Konnect US. Successful prior-stage evidence is required; no stage triggers the next.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#75839b"/></marker></defs><rect width="1440" height="1100" fill="#f4f7fc"/><style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:34px;font-weight:700;fill:#15253c}.sub{font-size:18px;fill:#52627a}.label{font-size:20px;font-weight:700;fill:#15253c}.body{font-size:16px;fill:#43546d}.small{font-size:14px;fill:#52627a}.pill{font-size:14px;font-weight:700;fill:#fff}</style>
<text x="48" y="65" class="title">Independent AI promotions across AWS, Azure and GCP</text>
<text x="48" y="98" class="sub">6 issue forms  •  6 isolated lanes  •  24 deployment targets  •  Konnect region: US</text>
<rect x="48" y="140" width="400" height="116" rx="14" fill="#fff" stroke="#dce4f0"/>
<rect x="64" y="156" width="28" height="28" rx="7" fill="#224868" stroke="#224868"/>
<text x="73" y="176" class="pill">1</text>
<text x="104" y="177" class="label">Submit an issue form</text>
<text x="68" y="208" class="body">LLM / MCP / A2A × internal / external</text>
<text x="68" y="231" class="body">Select gateway cloud and approved inputs</text>
<rect x="520" y="140" width="400" height="116" rx="14" fill="#fff" stroke="#dce4f0"/>
<rect x="536" y="156" width="28" height="28" rx="7" fill="#224868" stroke="#224868"/>
<text x="545" y="176" class="pill">2</text>
<text x="576" y="177" class="label">Validate the request</text>
<text x="540" y="208" class="body">Strict schemas, host policy, data class</text>
<text x="540" y="231" class="body">Scan candidate files; issue text stays data</text>
<rect x="992" y="140" width="400" height="116" rx="14" fill="#fff" stroke="#dce4f0"/>
<rect x="1008" y="156" width="28" height="28" rx="7" fill="#224868" stroke="#224868"/>
<text x="1017" y="176" class="pill">3</text>
<text x="1048" y="177" class="label">Review the draft PR</text>
<text x="1012" y="208" class="body">Catalog + scoped upstream mappings</text>
<text x="1012" y="231" class="body">Required CI checks and code-owner review</text>
<path d="M448,198 L510,198" fill="none" stroke="#75839b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M920,198 L982,198" fill="none" stroke="#75839b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1192,256 L1192,280 L248,280 L248,300" fill="none" stroke="#75839b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="310" width="400" height="116" rx="14" fill="#fff" stroke="#dce4f0"/>
<rect x="64" y="326" width="28" height="28" rx="7" fill="#224868" stroke="#224868"/>
<text x="73" y="346" class="pill">4</text>
<text x="104" y="347" class="label">Run the release security gate</text>
<text x="68" y="378" class="body">Gitleaks • Bandit • dependency audit</text>
<text x="68" y="401" class="body">Pinned tools, workflow lint, tests, schemas</text>
<rect x="520" y="310" width="400" height="116" rx="14" fill="#fff" stroke="#dce4f0"/>
<rect x="536" y="326" width="28" height="28" rx="7" fill="#224868" stroke="#224868"/>
<text x="545" y="346" class="pill">5</text>
<text x="576" y="347" class="label">Build one immutable bundle</text>
<text x="540" y="378" class="body">Scope each resource to its selected lane</text>
<text x="540" y="401" class="body">Separate gateway IDs, namespaces, secrets</text>
<rect x="992" y="310" width="400" height="116" rx="14" fill="#fff" stroke="#dce4f0"/>
<rect x="1008" y="326" width="28" height="28" rx="7" fill="#224868" stroke="#224868"/>
<text x="1017" y="346" class="pill">6</text>
<text x="1048" y="347" class="label">Trigger each stage separately</text>
<text x="1012" y="378" class="body">Same release ID + prior-stage receipt</text>
<text x="1012" y="401" class="body">Plan → approval → apply → verification</text>
<path d="M448,368 L510,368" fill="none" stroke="#75839b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M920,368 L982,368" fill="none" stroke="#75839b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="481" class="label">DEPLOYMENT TARGETS</text>
<text x="48" y="508" class="body">Dev → test → preprod → prod: separate manual triggers. The next stage requires verified predecessor evidence.</text>
