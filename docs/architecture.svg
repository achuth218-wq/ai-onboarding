<text x="48" y="930" class="label">Each target has its own: gateway • namespace • GitHub Environment • tokens • runner group</text>
<text x="48" y="965" class="body">No automatic stage chaining. One dispatch deploys one cloud / exposure / stage; each has its own approval.</text>
<text x="48" y="991" class="body">Promotion verifies source artifact identity, bundle digest, lane, predecessor stage and successful deployment receipts.</text>
<rect x="48" y="1022" width="1344" height="45" rx="9" fill="#e7edf5" stroke="#e7edf5"/>
<text x="65" y="1051" class="small">Build release creates the bundle only. Dev, test, preprod and prod are started independently from GitHub Actions or the CLI.</text>
