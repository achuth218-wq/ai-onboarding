name: Recover previous release
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Release workflow run ID containing the previous ai-release artifact
        required: true
        type: string
      environment:
        description: Environment to recover
        type: choice
        options: [dev, staging, prod]
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-onboarding-writer
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_recovery_run.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-release
          path: build/release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - run: python -m aiops verify
      - name: Verify artifact provenance against the selected release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: >-
          python -c "import json,os; m=json.load(open('build/release/bundle.json'));
          assert m['source_revision']==os.environ['SOURCE_SHA'], 'Source revision mismatch'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-release
          path: build/release/
          retention-days: 90
  recover:
    needs: prepare
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: ${{ inputs.environment }}
    secrets:
      KONNECT_READ_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
      AIOPS_SECRET_VALUES: ${{ secrets.AIOPS_SECRET_VALUES }}
      SMOKE_AUTH_VALUE: ${{ secrets.SMOKE_AUTH_VALUE }}
