name: Promote one immutable release
'on':
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      stage:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      previous_run_id:
        required: false
        type: string
        default: ''
      mode:
        required: false
        type: string
        default: promotion
permissions:
  contents: read
  actions: read
jobs:
  security:
    uses: ./.github/workflows/security-checks.yml
  prepare:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - name: Validate source runs and select exact artifacts
      id: provenance
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        PROMOTION_LANE: ${{ inputs.lane }}
        PROMOTION_STAGE: ${{ inputs.stage }}
        PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
        PROMOTION_MODE: ${{ inputs.mode }}
      run: python scripts/promotion_gate.py discover
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ steps.provenance.outputs.source_artifact_id }}
        run-id: ${{ inputs.release_run_id }}
        github-token: ${{ github.token }}
        path: build/release
        merge-multiple: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: steps.provenance.outputs.previous_artifact_id != ''
      with:
        artifact-ids: ${{ steps.provenance.outputs.previous_artifact_id }}
        run-id: ${{ inputs.previous_run_id }}
        github-token: ${{ github.token }}
        path: build/prior
        merge-multiple: true
    - name: Check identical bundle, preceding-stage evidence and current target configuration
      run: python scripts/promotion_gate.py verify
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ai-release
        path: build/release/
        retention-days: 90
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: promotion-context
        path: build/context/context.json
        retention-days: 90
        if-no-files-found: error
  deploy:
    needs: prepare
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: ${{ format('{0}-{1}', inputs.lane, inputs.stage) }}
  record:
    needs:
    - prepare
    - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-context
        path: build/context
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: deployment-${{ inputs.lane }}-${{ inputs.stage }}
        path: build/deployment
    - name: Record only verified deployment evidence
      run: python scripts/promotion_gate.py receipt
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: promotion-${{ inputs.lane }}-${{ inputs.stage }}
        path: build/promotion/promotion.json
        retention-days: 90
        if-no-files-found: error
