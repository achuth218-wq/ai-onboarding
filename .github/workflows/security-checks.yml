name: Security checks
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-security.lock'
    - run: python scripts/install_security_tools.py
    - name: Scan current files and Git history for credentials
      run: '.tools/gitleaks dir . --redact --no-banner --max-target-megabytes 2

        .tools/gitleaks git . --redact --no-banner --log-opts="--all"'
    - name: Python static security analysis
      run: python -m bandit -r aiops scripts -ll -ii
    - name: Audit runtime and scanner dependencies (fail closed)
      run: 'python -m pip_audit -r requirements.lock --disable-pip --require-hashes

        python -m pip_audit -r requirements-security.lock --disable-pip --require-hashes'
    - name: Workflow syntax and workflow security policy
      run: '.tools/actionlint -shellcheck= -pyflakes=

        python scripts/check_workflow_security.py

        python scripts/update_dependency_locks.py --check'
