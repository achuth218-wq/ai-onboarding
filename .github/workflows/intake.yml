name: Onboarding issue intake
'on':
  issues:
    types:
    - opened
    - reopened
    - edited
  workflow_dispatch:
    inputs:
      issue_number:
        description: Retry an open onboarding issue (numeric ID)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: onboarding-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  intake:
    if: github.event_name == 'issues' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: main
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - run: python scripts/install_security_tools.py
    - name: Record the exact trusted base revision
      id: base
      run: python -c "import os,subprocess; sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); open(os.environ['GITHUB_OUTPUT'],'a').write('sha='+sha+'\n')"
    - name: Validate form, scan candidate, create draft PR
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        INTAKE_BASE_SHA: ${{ steps.base.outputs.sha }}
      run: python scripts/intake_issue.py
