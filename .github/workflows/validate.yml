name: Validate
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - run: python -m unittest discover -s tests -v
    - run: python -m aiops validate
    - run: python -m aiops build --revision "$GITHUB_SHA"
    - run: python -m aiops verify
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: preview-${{ github.sha }}
        path: build/release/
        retention-days: 7
        if-no-files-found: error
  security:
    uses: ./.github/workflows/security-checks.yml
