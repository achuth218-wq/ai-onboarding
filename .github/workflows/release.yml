name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Also used by recovery.yml. One writer across all three environments in this repo.
concurrency:
  group: ai-onboarding-writer
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m aiops build --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-release
          path: build/release/
          retention-days: 90
          if-no-files-found: error
  dev:
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: dev
    secrets:
      KONNECT_READ_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
      AIOPS_SECRET_VALUES: ${{ secrets.AIOPS_SECRET_VALUES }}
      SMOKE_AUTH_VALUE: ${{ secrets.SMOKE_AUTH_VALUE }}
  staging:
    needs: dev
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
    secrets:
      KONNECT_READ_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
      AIOPS_SECRET_VALUES: ${{ secrets.AIOPS_SECRET_VALUES }}
      SMOKE_AUTH_VALUE: ${{ secrets.SMOKE_AUTH_VALUE }}
  prod:
    needs: staging
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prod
    secrets:
      KONNECT_READ_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
      AIOPS_SECRET_VALUES: ${{ secrets.AIOPS_SECRET_VALUES }}
      SMOKE_AUTH_VALUE: ${{ secrets.SMOKE_AUTH_VALUE }}
