name: Build release
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  security:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-checks.yml
  build:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - run: python -m unittest discover -s tests -v
    - run: python -m aiops build --revision "$GITHUB_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ai-release
        path: build/release/
        retention-days: 90
        if-no-files-found: error
    - name: Show release selection instructions
      run: 'python -c "import os; open(os.environ[''GITHUB_STEP_SUMMARY''],''a'').write(''Release run ID: ''+os.environ[''GITHUB_RUN_ID'']+''\n\nBuild
        only. Start Deploy dev independently with this run ID and a lane.\n'')"'
