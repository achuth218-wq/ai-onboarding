name: Build release
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  security:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security-checks.yml
  build:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - run: python -m unittest discover -s tests -v
    - run: python -m aiops build --revision "$GITHUB_SHA"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ai-release
        path: build/release/
        retention-days: 90
        if-no-files-found: error
    - name: Show release selection instructions
      run: 'python -c "import os; open(os.environ[''GITHUB_STEP_SUMMARY''],''a'').write(''Release run ID: ''+os.environ[''GITHUB_RUN_ID'']+''\n\nBuild
        only. Start Deploy dev independently with this run ID and a lane.\n'')"'
