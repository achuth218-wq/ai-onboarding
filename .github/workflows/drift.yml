name: Detect drift
'on':
  schedule:
  - cron: 17 4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - id: targets
      run: python -m aiops targets
  inspect:
    needs: targets
    if: needs.targets.outputs.has_targets == 'true'
    environment: ${{ matrix.environment }}-plan
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - run: python scripts/install_kongctl.py
    - run: python -m aiops build --revision "$GITHUB_SHA"
    - name: Read-only target drift check
      env:
        KONNECT_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
        TARGET_ENV: ${{ matrix.environment }}
      run: python -m aiops drift --environment "$TARGET_ENV" --output build/drift.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: drift-${{ matrix.environment }}
        path: build/drift.json
        retention-days: 14
        if-no-files-found: ignore
      if: always()
    - name: Clean CLI diagnostics
      if: always()
      run: python -c "import shutil; shutil.rmtree('.state', ignore_errors=True)"
