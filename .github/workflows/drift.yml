name: Detect drift
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/install_kongctl.py
      - run: python -m aiops build --revision "$GITHUB_SHA"
      - name: Detect managed-resource drift without mutation
        env:
          KONNECT_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
          TARGET_ENV: ${{ matrix.environment }}
        run: python -m aiops drift --environment "$TARGET_ENV" --output build/drift.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drift-${{ matrix.environment }}
          path: build/drift.json
          if-no-files-found: ignore
          retention-days: 14
