name: Deploy isolated target
'on':
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    environment: ${{ inputs.environment }}-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - run: python scripts/install_kongctl.py
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ai-release
        path: build/release
    - name: Plan with the target-specific read token
      id: plan
      env:
        KONNECT_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
        TARGET_ENV: ${{ inputs.environment }}
      run: python -m aiops plan --environment "$TARGET_ENV" --output build/review.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: review-${{ inputs.environment }}
        path: build/review.json
        retention-days: 90
        if-no-files-found: error
  apply:
    needs: plan
    environment: ${{ inputs.environment }}
    runs-on:
      group: aiops-${{ inputs.environment }}
      labels:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
    - run: python scripts/install_kongctl.py
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ai-release
        path: build/release
    - name: Recheck plan, apply, verify readiness and protocol access
      env:
        KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
        AIOPS_LLM_AUTH_HEADER: ${{ secrets.AIOPS_LLM_AUTH_HEADER }}
        SMOKE_AUTH_VALUE: ${{ secrets.SMOKE_AUTH_VALUE }}
        TARGET_ENV: ${{ inputs.environment }}
        EXPECTED_DIGEST: ${{ needs.plan.outputs.digest }}
      run: python -m aiops apply --environment "$TARGET_ENV" --expected-plan-digest "$EXPECTED_DIGEST" --output build/deployment.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: deployment-${{ inputs.environment }}
        path: build/deployment.json
        retention-days: 90
        if-no-files-found: ignore
      if: always()
    - name: Clean private CLI diagnostics
      if: always()
      run: python -c "import shutil; shutil.rmtree('.state', ignore_errors=True)"
