name: Deploy one environment
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      KONNECT_READ_TOKEN:
        required: true
      KONNECT_TOKEN:
        required: true
      AIOPS_SECRET_VALUES:
        required: true
      SMOKE_AUTH_VALUE:
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/install_kongctl.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-release
          path: build/release
      - name: Plan and publish review summary
        id: plan
        env:
          KONNECT_TOKEN: ${{ secrets.KONNECT_READ_TOKEN }}
          TARGET_ENV: ${{ inputs.environment }}
        run: python -m aiops plan --environment "$TARGET_ENV" --output build/review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-${{ inputs.environment }}
          path: build/review.json
          retention-days: 90
  apply:
    needs: plan
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(vars.AIOPS_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/install_kongctl.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-release
          path: build/release
      - name: Recheck plan, apply, wait for all nodes, and smoke test
        env:
          # These are environment secrets; see README for the exact names.
          KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
          AIOPS_SECRET_VALUES: ${{ secrets.AIOPS_SECRET_VALUES }}
          SMOKE_AUTH_VALUE: ${{ secrets.SMOKE_AUTH_VALUE }}
          TARGET_ENV: ${{ inputs.environment }}
          EXPECTED_DIGEST: ${{ needs.plan.outputs.digest }}
        run: >-
          python -m aiops apply --environment "$TARGET_ENV"
          --expected-plan-digest "$EXPECTED_DIGEST" --output build/deployment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-${{ inputs.environment }}
          path: build/deployment.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Remove private CLI diagnostics from persistent runners
        if: always()
        run: python -c "import shutil; shutil.rmtree('.state', ignore_errors=True)"
